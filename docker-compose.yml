services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./coverage-report:/var/www/html/coverage-report
      - sqlite_data:/app/database
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      CACHE_STORE: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      ADMIN_EMAIL: admin@example.com
    depends_on:
      redis:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - sqlite_data:/app/database
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      CACHE_STORE: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      ADMIN_EMAIL: admin@example.com
    depends_on:
      redis:
        condition: service_healthy
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=60
    stop_signal: SIGTERM
    stop_grace_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  sqlite_data:
